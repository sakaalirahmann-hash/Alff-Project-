<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alff Calculator Project</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="calculator-container">
    <h1>Alff Calculator</h1>

    <div class="calculator">
      <input type="text" id="display" readonly />

      <div class="buttons">
        <button class="btn-func" onclick="clearDisplay()">C</button>
        <button class="btn-func" onclick="deleteLast()">⌫</button>
        <button class="btn-op" onclick="append('%')">%</button>
        <button class="btn-op" onclick="append('/')">÷</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button class="btn-op" onclick="append('*')">×</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button class="btn-op" onclick="append('-')">−</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button class="btn-op" onclick="append('+')">+</button>

        <button onclick="append('0')" class="zero">0</button>
        <button onclick="append('.')">.</button>
        <button class="btn-eq" onclick="calculate()">=</button>
      </div>
    </div>

    <div class="theme-toggle">
      <label>
        <input type="checkbox" id="themeSwitch" onchange="toggleTheme()" />
        🌙 Mode Gelap / ☀️ Mode Terang
      </label>
    </div>
  </div>

  <footer>
    <p>Made by <b>Alfareza</b> — © 2025 Alff Project</p>
  </footer>

  <script src="main.js"></script>
</body>
</html>
